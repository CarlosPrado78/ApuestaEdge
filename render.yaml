# Servicio web permanente en Render.
# Conecta el repo en render.com → New → Web Service → usa este archivo.
services:
  - type: web
    name: apuestaedge
    runtime: python
    autoDeploy: true
    # Render instala requirements.txt y arranca con esto:
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APUESTAEDGE_DATA_DIR
        value: /data
      # Stripe keys - configurar en el panel de Render (Variables de entorno):
      #   Añade STRIPE_SECRET_KEY y STRIPE_WEBHOOK_SECRET con sync: false
      #   STRIPE_WEBHOOK_SECRET: whsec_... (generado por Stripe en el dashboard)
      #   STRIPE_SECRET_KEY: sk_test_... (clave secreta de Stripe test)
      # Acceso por correo (magic link): configura un proveedor de correo para que
      # los usuarios puedan entrar. Sin esto el login devuelve 503.
      #   EMAIL_FROM, SMTP_HOST/PORT/USER/PASSWORD  (Brevo, gratis, sin dominio)
      #   o RESEND_API_KEY (requiere dominio verificado)
      #   PUBLIC_BASE_URL (opcional; se infiere del Host si no se define)
      # PostgreSQL (persistencia real): define DATABASE_URL en el dashboard
      #   (Neon/Supabase/Render Postgres). Sin ella se usa SQLite en /data,
      #   que en el plan Free se borra en cada despliegue.
    disk:
      name: apuestaedge-data
      mountPath: /data
      sizeGB: 1